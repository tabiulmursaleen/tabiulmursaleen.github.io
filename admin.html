
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <title>অ্যাডমিন লগইন | তাবিউল মুরসালীন নগর কারিগরি স্কুল এন্ড কলেজ</title>
  <link rel="stylesheet" href="css/admin.css?v=20261025-footer-edit22">
<link rel="icon" type="image/png" sizes="512x512" href="images/logo/favicon-512.png">
<link rel="apple-touch-icon" sizes="512x512" href="images/logo/favicon-512.png">
<link rel="icon" href="favicon.ico" sizes="256x256" type="image/x-icon">
</head>
<body>

  <main class="login-container">
    <section class="login-welcome" aria-label="প্রতিষ্ঠানের পরিচিতি">
      <span class="login-welcome-kicker">কারিগরি শিক্ষা · দক্ষতা · সম্ভাবনা</span>
      <h2>তাবিউল মুরসালীন নগর<br>কারিগরি স্কুল এন্ড কলেজ</h2>
      <span class="login-welcome-eiin">EIIN No. 136065</span>
    </section>

    <section class="login-card">
      <div class="school-icon">🏫</div>

      <h1>অ্যাডমিন লগইন</h1>
      <form id="loginForm">
        <label for="email">ইমেইল ঠিকানা</label>
        <input
          type="email"
          id="email"
          autocomplete="username"
          placeholder="আপনার ইমেইল লিখুন"
          required
        >

        <label for="password">পাসওয়ার্ড</label>
        <input
          type="password"
          id="password"
          autocomplete="current-password"
          placeholder="আপনার পাসওয়ার্ড লিখুন"
          required
        >

        <button type="submit" id="loginButton">লগইন করুন</button>
        <p id="loginMessage" role="status" aria-live="polite"></p>
      </form>

      <a href="index.html" class="back-link">← মূল ওয়েবসাইটে ফিরে যান</a>
      <p class="login-developer-credit">ডিজাইন ও ডেভেলপমেন্ট <a href="https://wa.me/8801741753844" target="_blank" rel="noopener noreferrer">Jamil Hossain</a></p>
    </section>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
